<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ateliê de Natal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Outfit:wght@200;300;400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, simple, for someone who is not a designer — big buttons, one step at a time.
   IDEA: a little print shop counter: pick a design, fill it in, lay it on the A4 sheet.
   PICTURE: the live design preview and the real A4 sheets are the picture.
   COLOUR and TYPE: the catalogue's own palette — pine green, Christmas red, gold; Fraunces + Outfit.
   LAYOUT: three columns on a computer (choose · personalise · sheets), stacked on small screens. */
:root{color-scheme:light dark;
 --bg:light-dark(#F6F1E7,#101A15);--card:light-dark(#FFFFFF,#18261F);--ink:light-dark(#1F2A24,#EFEAE0);--soft:light-dark(#5B665F,#AEB8B1);
 --line:light-dark(#E4DCCB,#2C3D34);--green:#1F4D3A;--red:#A8322A;--gold:#C9A24A;--chip:light-dark(#EFE6D6,#22352C)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.05;margin:0;text-wrap:balance}
.top{background:var(--green);color:#FBF6EE;padding:22px max(4vw,16px);display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline}
.top h1{font-size:clamp(28px,4vw,40px)}.top p{margin:0;color:#D5E1D9}
.grid{display:grid;gap:18px;padding:18px max(2vw,12px);grid-template-columns:300px minmax(0,1fr) 400px;align-items:start}
@media(max-width:1250px){.grid{grid-template-columns:280px minmax(0,1fr)}#folhas{grid-column:1/-1}}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{font-size:24px;margin-bottom:12px}.card h2 b{color:var(--red);font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
button,.btn{font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.tabs button[aria-pressed=true]{background:var(--green);color:#FBF6EE;border-color:var(--green)}
.primary{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
.ghost{background:transparent}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-height:70vh;overflow:auto;padding:2px}
.th{display:flex;flex-direction:column;gap:6px;align-items:center;padding:8px;text-align:center;font-size:14px;line-height:1.2}
.th[aria-pressed=true]{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.mini{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);overflow:hidden}
.stage{background:repeating-conic-gradient(var(--chip) 0 25%,transparent 0 50%) 0 0/22px 22px;border-radius:12px;padding:14px;display:flex;justify-content:center;min-height:160px}
.stage .mini{touch-action:none}
.slot img{user-select:none}.stage .slot,.stage img[data-free]{cursor:grab}
.hint{color:var(--soft);font-size:14px;margin:8px 0 0}
.form{display:grid;gap:14px;margin-top:16px}
.f label{display:block;font-weight:500;margin-bottom:5px}
.f input[type=text],.f select,.qty input{font:inherit;font-size:16px;width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:44px;height:44px;padding:0;border-radius:50%;border:3px solid var(--line)}
.sw button[aria-pressed=true]{border-color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button[aria-pressed=true]{background:var(--green);color:#FBF6EE;border-color:var(--green)}
.ph{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.ph input[type=range]{flex:1 1 140px;accent-color:var(--red)}
.ph .ok{color:var(--green);font-weight:600}.ph .no{color:var(--red)}
.addrow{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.qty{width:110px}.qty label{display:block;font-weight:500;margin-bottom:5px}
.warn{background:light-dark(#FFF4D6,#3A3014);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;margin-top:12px}
.list{display:grid;gap:8px;margin-bottom:14px}
.it{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}
.it .mini{width:64px;display:flex;justify-content:center;background:transparent;box-shadow:none}
.it b{display:block;font-weight:600}.it small{color:var(--soft)}
.it .ctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.it .ctl button{min-height:36px;min-width:36px;padding:4px 8px}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.opts label{display:flex;gap:8px;align-items:center}
.opts input{width:20px;height:20px;accent-color:var(--red)}
.pages{display:grid;gap:14px}
.pg{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;overflow:hidden}
.pgl{font-size:13px;color:var(--soft);margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.empty{color:var(--soft);border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
.sheet{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff}
.pi{position:absolute;overflow:hidden}
.ruler{position:absolute;left:5mm;top:292mm;width:50mm;border-top:.3mm solid #000;font:7pt Outfit,sans-serif;color:#000;padding-top:.5mm}
#printArea{display:none}
@media print{@page{size:A4;margin:0}body{background:#fff}.top,.grid{display:none!important}#printArea{display:block}.sheet{break-after:page}}
@media(prefers-reduced-motion:no-preference){.th,.it{transition:box-shadow .15s}}
</style>
</head>
<body>
<header class="top"><h1>Ateliê de Natal</h1><p>Escolha a arte, coloque o nome e a foto, e mande para a folha A4.</p></header>
<main class="grid">
 <section class="card" id="escolher"><h2><b>1.</b> Escolha a arte</h2><div class="tabs" id="tabs"></div><div class="thumbs" id="thumbs"></div></section>
 <section class="card" id="personalizar"><h2><b>2.</b> Personalize · <span id="tnome"></span></h2>
  <div class="stage" id="stage"></div>
  <p class="hint" id="dica"></p>
  <div class="form" id="form"></div>
  <div class="addrow">
   <div class="qty"><label for="qty">Quantidade</label><input id="qty" type="number" min="1" max="99" value="1" inputmode="numeric"></div>
   <label class="opts" id="versoBox" hidden><span><input type="checkbox" id="verso" checked> Incluir o verso</span></label>
   <button class="primary" id="add">Adicionar à folha</button>
   <button class="ghost" id="cancel" hidden>Cancelar edição</button>
  </div>
  <div class="warn" id="warn" hidden></div>
 </section>
 <section class="card" id="folhas"><h2><b>3.</b> Folhas A4</h2>
  <div class="list" id="list"></div>
  <div class="opts">
   <label><input type="checkbox" id="mirror"> Espelhar para sublimação (deixe marcado)</label>
   <label><input type="checkbox" id="guias"> Cruz cinza-clara atrás de cada arte (guia para centralizar)</label>
   <label><input type="checkbox" id="ruler"> Imprimir régua de teste de 5 cm na 1ª folha</label>
  </div>
  <div class="pages" id="pages"></div>
  <div class="actions"><button class="primary" id="dl">Baixar folhas para imprimir</button><button id="pr">Imprimir agora</button></div>
  <p class="hint" id="pmsg">Na janela de impressão escolha: papel A4 · Escala 100% (Tamanho real) · Margens: Nenhuma.</p>
 </section>
</main>
<div id="printArea"></div>

const clone=o=>JSON.parse(JSON.stringify(o));
function defaults(t){const v={};t.fields.forEach(f=>{v[f.k]=f.t==='photo'?null:f.t==='photos'?[]:f.d});return v}
function design(t,v,scale){return `<div class="mini" style="width:${(t.w*scale).toFixed(1)}px;height:${(t.h*scale).toFixed(1)}px;position:relative"><div style="width:${t.w}px;height:${t.h}px;transform:scale(${scale});transform-origin:0 0;position:absolute;left:0;top:0">${t.html(v)}</div></div>`}
let S={items:[],mirror:true,ruler:true,guias:true},prod='Canecas',cur=null,confirmNoPhoto=false;

/* ---------- saving in this browser (IndexedDB) ---------- */
const store={db:null,
 open(){return new Promise(r=>{try{const q=indexedDB.open('atelie-natal',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
 get(){return new Promise(r=>{try{const q=this.db.transaction('s').objectStore('s').get('estado');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})},
 set(v){try{this.db.transaction('s','readwrite').objectStore('s').put(v,'estado')}catch(e){}}};
let saveT;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>store.set({items:S.items,mirror:S.mirror,ruler:S.ruler,guias:S.guias}),400)};

/* ---------- 1. choose ---------- */
function renderTabs(){$('tabs').innerHTML=PRODS.map(p=>`<button aria-pressed="${p===prod}" data-p="${p}">${p}</button>`).join('')}
function renderThumbs(){
 const list=T.filter(t=>t.prod===prod&&!(t.prod==='Enfeites'&&/verso/.test(t.nome)));
 $('thumbs').innerHTML=list.map(t=>{const s=Math.min(110/t.w,110/t.h);return `<button class="th" data-t="${t.id}" aria-pressed="${cur&&cur.tid===t.id&&!cur.edit}">${design(t,defaults(t),s)}<span>${esc(t.nome)}</span></button>`}).join('');
}
function pick(tid,item){
 const t=byId[tid];confirmNoPhoto=false;$('warn').hidden=true;
 cur=item?{tid,v:clone(item.v),edit:item.uid}:{tid,v:defaults(t),edit:null};
 $('qty').value=item?item.qty:1;
 $('tnome').textContent=t.prod.replace(/s$/,'')+' '+t.nome;
 $('versoBox').hidden=!t.pair||!!item;
 $('add').textContent=item?'Salvar alterações':'Adicionar à folha';
 $('cancel').hidden=!item;
 const ph=t.fields.some(f=>f.t==='photo'||f.t==='photos');
 $('dica').textContent=t.fields.length?(ph?'Depois de escolher a foto, arraste-a na prévia para ajustar e use o zoom abaixo.':'Altere os campos abaixo; a prévia muda na hora.'):'Esta arte é pronta, sem nada para alterar. É só escolher a quantidade.';
 renderForm();renderStage();renderThumbs();
 if(innerWidth<820)$('personalizar').scrollIntoView({behavior:'smooth'});

/* ---------- 2. personalise ---------- */

 box.innerHTML=design(t,cur.v,stageScale);

function renderForm(){

  if(f.t==='select')return `<div class="f"><label>${esc(f.l)}</label><div class="seg">${f.o.map(o=>`<button type="button" data-k="${f.k}" data-o="${esc(o)}" aria-pressed="${v[f.k]===o}">${esc(o)}</button>`).join('')}</div></div>`;
  if(f.t==='color')return `<div class="f"><label>${esc(f.l)}</label><div class="sw">${f.o.map(o=>`<button type="button" data-k="${f.k}" data-o="${o}" aria-label="Cor ${o}" aria-pressed="${v[f.k]===o}" style="background:${o}"></button>`).join('')}</div></div>`;
  if(f.t==='photos'){const a=v[f.k]||[];return `<div class="f"><label>${esc(f.l)}</label>${a.map((p,i)=>`<div class="ph" style="margin-bottom:8px"><img src="${p.src}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:6px"><span>Tamanho</span><input type="range" min="0.1" max="3" step="0.01" value="${p.s}" data-fz="${f.k}:${i}" aria-label="Tamanho da foto ${i+1}"><button type="button" data-fc="${f.k}:${i}">Centralizar</button><button type="button" data-fx="${f.k}:${i}">Tirar</button></div>`).join('')}<div class="ph"><label class="btn">+ Adicionar foto<input type="file" accept="image/*" multiple data-fadd="${f.k}" hidden></label>${a.length?'':'<span class="no">Sem foto ainda</span>'}</div><p class="hint">Diminua o tamanho para sobrar branco em volta. Arraste cada foto na prévia para posicionar. A última foto adicionada fica por cima.</p></div>`}
  const p=v[f.k];
  return `<div class="f"><label>${esc(f.l)}</label><div class="ph">
   <label class="btn">${p?'Trocar foto':'Escolher foto'}<input type="file" accept="image/*" data-k="${f.k}" hidden></label>
   ${p?`<span>Zoom</span><input type="range" min="1" max="3" step="0.02" value="${p.z}" data-z="${f.k}" aria-label="Zoom da ${esc(f.l)}"><button type="button" data-c="${f.k}">Centralizar</button><button type="button" data-r="${f.k}">Tirar</button>`:'<span class="no">Sem foto ainda</span>'}
  </div></div>`;
 }).join('');
}
function setVal(k,val){cur.v[k]=val;confirmNoPhoto=false;$('warn').hidden=true;renderStage()}
$('form').addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.k&&el.type==='text')setVal(el.dataset.k,el.value);
 if(el.dataset.z){cur.v[el.dataset.z].z=+el.value;updateImg(el.dataset.z)}
 if(el.dataset.fz){const[k,i]=el.dataset.fz.split(':');cur.v[k][+i].s=+el.value;updateFree(k,+i)}
});
$('form').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.o!=null){setVal(b.dataset.k,b.dataset.o);renderForm()}
 if(b.dataset.c){Object.assign(cur.v[b.dataset.c],{z:1,dx:0,dy:0});renderStage();renderForm()}
 if(b.dataset.r){cur.v[b.dataset.r]=null;renderStage();renderForm()}
 if(b.dataset.fc){const[k,i]=b.dataset.fc.split(':');Object.assign(cur.v[k][+i],{x:.5,y:.5});renderStage()}
 if(b.dataset.fx){const[k,i]=b.dataset.fx.split(':');cur.v[k].splice(+i,1);renderStage();renderForm()}
});
$('form').addEventListener('change',async e=>{
 const el=e.target;if(el.type!=='file'||!el.files[0])return;
 if(el.dataset.fadd){const k=el.dataset.fadd;$('dica').textContent='Carregando…';for(const f of el.files){try{const p=await loadPhoto(f);const a=cur.v[k]=cur.v[k]||[];const n=a.length;a.push({src:p.src,iw:p.iw,ih:p.ih,x:n?.5+((n%3)-1)*.18:.5,y:.5,s:n?.45:1})}catch(err){}}
  $('dica').textContent='Arraste as fotos na prévia e ajuste o tamanho de cada uma.';confirmNoPhoto=false;$('warn').hidden=true;renderForm();renderStage();return}
 const k=el.dataset.k;$('dica').textContent='Carregando a foto…';
 try{cur.v[k]=await loadPhoto(el.files[0]);$('dica').textContent='Arraste a foto na prévia para ajustar e use o zoom.'}
 catch(err){$('dica').textContent='Não consegui abrir essa foto. Tente outra (JPG ou PNG).'}
 confirmNoPhoto=false;$('warn').hidden=true;renderForm();renderStage();
});
function loadPhoto(file){return new Promise((res,rej)=>{
 const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const M=2400,k=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res({src:c.toDataURL('image/jpeg',.9),iw:c.width,ih:c.height,z:1,dx:0,dy:0})};
 im.onerror=()=>{URL.revokeObjectURL(url);rej()};im.src=url})}
function updateFree(k,i){const im=$('stage').querySelector(`img[data-free="${k}:${i}"]`);if(im)im.setAttribute('style','position:absolute;max-width:none;'+freeBox(cur.v[k][i],+im.dataset.w,+im.dataset.h))}
function updateImg(k){const s=$('stage').querySelector(`.slot[data-slot="${k}"]`);if(!s)return;const img=s.querySelector('img');if(img)img.setAttribute('style','position:absolute;max-width:none;'+imgBox(cur.v[k],+s.dataset.w,+s.dataset.h))}
/* drag + wheel on photos */
let drag=null;
$('stage').addEventListener('pointerdown',e=>{const fi=e.target.closest('img[data-free]');if(fi){e.preventDefault();const[k,i]=fi.dataset.free.split(':');drag={free:1,k,i:+i,x:e.clientX,y:e.clientY,r:fi.parentElement.getBoundingClientRect()};fi.setPointerCapture(e.pointerId);return}const s=e.target.closest('.slot');if(!s||!cur.v[s.dataset.slot])return;e.preventDefault();drag={k:s.dataset.slot,x:e.clientX,y:e.clientY,r:s.getBoundingClientRect()};s.setPointerCapture(e.pointerId);s.style.cursor='grabbing'});
$('stage').addEventListener('pointermove',e=>{if(!drag)return;if(drag.free){const p=cur.v[drag.k][drag.i];p.x+=(e.clientX-drag.x)/drag.r.width;p.y+=(e.clientY-drag.y)/drag.r.height;drag.x=e.clientX;drag.y=e.clientY;updateFree(drag.k,drag.i);return}const p=cur.v[drag.k];p.dx+=(e.clientX-drag.x)/drag.r.width;p.dy+=(e.clientY-drag.y)/drag.r.height;drag.x=e.clientX;drag.y=e.clientY;updateImg(drag.k)});
const endDrag=()=>{if(drag){drag=null;renderForm()}};
$('stage').addEventListener('pointerup',endDrag);$('stage').addEventListener('pointercancel',endDrag);
$('stage').addEventListener('wheel',e=>{const fi=e.target.closest('img[data-free]');if(fi){e.preventDefault();const[k,i]=fi.dataset.free.split(':');const p=cur.v[k][+i];p.s=Math.min(3,Math.max(.1,p.s*(e.deltaY<0?1.05:.95)));updateFree(k,+i);const r=$('form').querySelector(`[data-fz="${k}:${i}"]`);if(r)r.value=p.s;return}const s=e.target.closest('.slot');if(!s||!cur.v[s.dataset.slot])return;e.preventDefault();const p=cur.v[s.dataset.slot];p.z=Math.min(3,Math.max(1,p.z*(e.deltaY<0?1.05:.95)));updateImg(s.dataset.slot);const r=$('form').querySelector(`[data-z="${s.dataset.slot}"]`);if(r)r.value=p.z},{passive:false});

/* add / save */
function missingPhotos(){const t=byId[cur.tid];return t.fields.filter(f=>(f.t==='photos'&&!(cur.v[f.k]||[]).length)||f.t==='photo'&&!cur.v[f.k]&&!(t.id==='CanecaE'&&cur.v.comFoto!=='Com foto')).map(f=>f.l)}
$('add').onclick=()=>{
 const t=byId[cur.tid],qty=Math.max(1,Math.min(99,parseInt($('qty').value)||1));
 const miss=missingPhotos();
 if(miss.length&&!confirmNoPhoto){confirmNoPhoto=true;$('warn').hidden=false;$('warn').textContent=`Falta: ${miss.join(', ')}. O quadro sairá escrito "FOTO" na impressão. Clique de novo em "${$('add').textContent}" para continuar mesmo assim.`;return}
 if(cur.edit){const it=S.items.find(i=>i.uid===cur.edit);if(it){it.v=clone(cur.v);it.qty=qty}}
 else{S.items.push({uid:'i'+Date.now()+Math.random().toString(36).slice(2,6),tid:cur.tid,v:clone(cur.v),qty});
  if(t.pair&&$('verso').checked)S.items.push({uid:'i'+Date.now()+'v',tid:t.pair,v:{},qty});}
 const was=!!cur.edit;pick(cur.tid);save();renderSheets();
 $('dica').textContent=was?'Alterações salvas na folha.':'Adicionado à folha! Você pode fazer o próximo.';
};
$('cancel').onclick=()=>pick(cur.tid);

/* ---------- 3. sheets ---------- */
function pack(){
 const W=210-2*MARG,H=297-2*MARG,inst=[];
 S.items.forEach(it=>{const t=byId[it.tid];if(!t)return;for(let i=0;i<it.qty;i++){const w=t.w*MM,h=t.h*MM,rot=w>W+.01&&h<=W+.01;inst.push({it,t,rot,w:rot?h:w,h:rot?w:h})}});
 inst.sort((a,b)=>b.h-a.h||b.w-a.w);
 const sheets=[];
 for(const o of inst){let ok=false;
  for(const sh of sheets){
   for(const r of sh.rows)if(o.h<=r.h+.01&&r.x+o.w<=W+.01){o.x=r.x;o.y=r.y;r.x+=o.w+GAP;sh.items.push(o);ok=true;break}
   if(ok)break;
   const last=sh.rows[sh.rows.length-1],ny=last.y+last.h+GAP;
   if(ny+o.h<=H+.01){sh.rows.push({y:ny,h:o.h,x:o.w+GAP});o.x=0;o.y=ny;sh.items.push(o);ok=true;break}
  }
  if(!ok){o.x=0;o.y=0;sheets.push({rows:[{y:0,h:o.h,x:o.w+GAP}],items:[o]})}
 }
 return sheets;
}
function guides(sh){if(!S.guias)return'';const L=GAP+.5,c='#9E9E9E';return sh.items.map(o=>{const cx=MARG+o.x+o.w/2,cy=MARG+o.y+o.h/2;return `<div style="position:absolute;left:${(MARG+o.x-L).toFixed(2)}mm;top:${(cy-.1).toFixed(2)}mm;width:${(o.w+2*L).toFixed(2)}mm;height:.25mm;background:${c}"></div><div style="position:absolute;top:${(MARG+o.y-L).toFixed(2)}mm;left:${(cx-.1).toFixed(2)}mm;height:${(o.h+2*L).toFixed(2)}mm;width:.25mm;background:${c}"></div>`}).join('')}
function sheetHTML(sh,i){
 return `<div class="sheet">${guides(sh)}${sh.items.map(o=>`<div class="pi" style="left:${(MARG+o.x).toFixed(2)}mm;top:${(MARG+o.y).toFixed(2)}mm;width:${o.w.toFixed(2)}mm;height:${o.h.toFixed(2)}mm${S.mirror?';transform:scaleX(-1)':''}"><div style="width:${o.t.w}px;height:${o.t.h}px;transform:${o.rot?`translate(${(o.t.h*SC).toFixed(2)}px,0) rotate(90deg) `:''}scale(${SC});transform-origin:0 0">${o.t.html(o.it.v)}</div></div>`).join('')}${i===0&&S.ruler?'<div class="ruler">régua de teste: esta linha deve medir 5 cm</div>':''}</div>`
}
function renderList(){
 if(!S.items.length){$('list').innerHTML='<div class="empty">Nada na folha ainda. Escolha uma arte, personalize e clique em <b>Adicionar à folha</b>.</div>';return}
 $('list').innerHTML=S.items.map(it=>{const t=byId[it.tid];if(!t)return'';const s=Math.min(64/t.w,56/t.h);
  const txt=['nome','nomes','sobrenome'].map(k=>it.v[k]).filter(Boolean)[0]||'';
  return `<div class="it">${design(t,it.v,s)}<div><b>${esc(t.prod.replace(/s$/,''))} ${esc(t.nome)}</b><small>${esc(txt)}</small></div><div class="ctl"><button data-m="${it.uid}" aria-label="Menos um">−</button><span>${it.qty}</span><button data-p="${it.uid}" aria-label="Mais um">+</button>${t.fields.length?`<button data-e="${it.uid}">Editar</button>`:''}<button data-x="${it.uid}" aria-label="Remover">✕</button></div></div>`}).join('');
}
function renderSheets(){
 renderList();
 const sheets=pack(),box=$('pages');
 if(!sheets.length){box.innerHTML='';return}
 const w=Math.min(box.clientWidth||360,520),k=w/(210*96/25.4);
 box.innerHTML=sheets.map((sh,i)=>`<div><div class="pgl">Folha ${i+1} de ${sheets.length}</div><div class="pg" style="width:${w}px;height:${(w*297/210).toFixed(1)}px"><div style="transform:scale(${k});transform-origin:0 0;position:absolute">${sheetHTML(sh,i)}</div></div></div>`).join('');
}
$('list').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const f=id=>S.items.find(i=>i.uid===id);
 if(b.dataset.p){f(b.dataset.p).qty=Math.min(99,f(b.dataset.p).qty+1)}
 if(b.dataset.m){const it=f(b.dataset.m);it.qty=Math.max(1,it.qty-1)}
 if(b.dataset.x){S.items=S.items.filter(i=>i.uid!==b.dataset.x)}
 if(b.dataset.e){const it=f(b.dataset.e);prod=byId[it.tid].prod;renderTabs();pick(it.tid,it);return}
 save();renderSheets();
});
$('mirror').onchange=e=>{S.mirror=e.target.checked;save();renderSheets()};
$('ruler').onchange=e=>{S.ruler=e.target.checked;save();renderSheets()};
$('guias').onchange=e=>{S.guias=e.target.checked;save();renderSheets()};
const FONTS=document.querySelector('link[href*="fonts.googleapis"]').outerHTML;
function printDoc(){
 const sheets=pack();
 return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Folhas para imprimir</title>${FONTS}<style>@page{size:A4;margin:0}body{margin:0;background:#ddd;font-family:Outfit,sans-serif}.tip{max-width:210mm;margin:12px auto;background:#fff;padding:12px 16px;border-radius:8px;font-size:15px}.sheet{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff;margin:0 auto 12px}.pi{position:absolute;overflow:hidden}.ruler{position:absolute;left:5mm;top:292mm;width:50mm;border-top:.3mm solid #000;font:7pt Outfit,sans-serif;padding-top:.5mm}@media print{body{background:#fff}.tip{display:none}.sheet{margin:0;break-after:page}}</style></head><body><div class="tip"><b>Para sair no tamanho certo:</b> papel A4 · Escala 100% (ou "Tamanho real") · Margens: Nenhuma · desmarque "Ajustar à página". ${sheets.length} folha(s).</div>${sheets.map(sheetHTML).join('')}<script>document.fonts.ready.then(function(){setTimeout(function(){window.print()},700)})<\/script></body></html>`;
}
$('dl').onclick=async()=>{
 if(!S.items.length){$('pmsg').textContent='Adicione pelo menos uma arte antes.';return}
 const d=window.claude&&await window.claude.use('downloads').catch(()=>null);
 const html=printDoc();
 if(d){try{await d.save({filename:'folhas-natal.html',data:new Blob([html],{type:'text/html'})});$('pmsg').textContent='Arquivo baixado. Abra "folhas-natal.html" no navegador: a impressão abre sozinha. Use Escala 100% e Margens: Nenhuma.';return}
  catch(e){try{await d.save({filename:'folhas-natal.html',data:html});$('pmsg').textContent='Arquivo baixado. Abra "folhas-natal.html" e imprima com Escala 100%.';return}catch(e2){}}}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='folhas-natal.html';a.click();$('pmsg').textContent='Se o download não começou, tente "Imprimir agora".'}catch(e){$('pmsg').textContent='Não foi possível baixar aqui. Tente "Imprimir agora".'}
};
$('pr').onclick=()=>{
 if(!S.items.length){$('pmsg').textContent='Adicione pelo menos uma arte antes.';return}
 $('printArea').innerHTML=pack().map(sheetHTML).join('');
 try{document.fonts.ready.then(()=>window.print())}catch(e){}
 $('pmsg').textContent='Se a janela de impressão não abriu, use "Baixar folhas para imprimir".';
};
/* ---------- start ---------- */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;prod=b.dataset.p;renderTabs();renderThumbs()});
$('thumbs').addEventListener('click',e=>{const b=e.target.closest('.th');if(b)pick(b.dataset.t)});
let lw1=0,lw2=0;const ro=new ResizeObserver(()=>{const a=$('stage').clientWidth,b=$('pages').clientWidth;if(a!==lw1){lw1=a;renderStage()}if(b!==lw2){lw2=b;renderSheets()}});
(async()=>{
 renderTabs();pick('CanecaA');
 await store.open();const st=await store.get();
 if(st&&Array.isArray(st.items)){S.items=st.items.filter(i=>byId[i.tid]);S.mirror=st.mirror!==false;S.ruler=st.ruler!==false;S.guias=st.guias!==false}
 $('mirror').checked=S.mirror;$('ruler').checked=S.ruler;$('guias').checked=S.guias;
 renderSheets();ro.observe($('stage'));ro.observe($('pages'));
 try{document.fonts.ready.then(()=>{renderStage();renderThumbs();renderSheets()})}catch(e){}
})();
}
</script>
